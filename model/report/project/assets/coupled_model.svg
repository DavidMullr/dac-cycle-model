<rect x="974" y="287" width="100" height="74" rx="7" fill="#f8e9e6" stroke="#b66b54" stroke-width="1.5"/><text x="1024" y="318" text-anchor="middle" font-size="17">Heater</text><text x="1024" y="345" text-anchor="middle" font-size="17">Th</text><path d="M936 324H965" stroke="#2a8070" stroke-width="2" marker-start="url(#heat)" marker-end="url(#heat)"/>
